<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вероника · English in Spain</title>
</head><body>
<p style="font-family:system-ui;text-align:center;margin-top:40px">Загрузка…</p>
<script>
async function go() {
  const names = ['sp0.txt', 'sp1.txt', 'sp2.txt'];
  const parts = await Promise.all(names.map(n => fetch(n).then(r => r.text())));
  const bin = atob(parts.join(''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
}
go().catch(e => {
  document.body.innerHTML = '<p style="font-family:system-ui;text-align:center;color:red">Ошибка: '+e+
  '</p><p style="text-align:center">Открой файл Veronika_Spain_Survival_Interactive.html</p>';
});
</script>
</body></html>
