<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Вероника · Предлоги с транспортом</title>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40px">Загрузка…</p>
<script>
async function go() {
  const parts = await Promise.all([0,1].map(i => fetch('p'+i+'.txt').then(r => r.text())));
  const bin = atob(parts.join(''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
}
go().catch(e => {
  document.body.innerHTML = '<p style="font-family:system-ui;text-align:center;color:red">Ошибка: '+e+
  '</p><p style="text-align:center"><a href="https://sharehtml.zhenjia.dev/v/REHDrcKEZE/">Запасная ссылка</a></p>';
});
</script>
</body>
</html>
