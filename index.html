<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Вероника · Предлоги с транспортом</title>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40px">Загрузка…</p>
<script>
const parts = [];
async function load() {
  for (let i = 0; i < 3; i++) {
    const r = await fetch('data/part' + i + '.txt');
    parts.push(await r.text());
  }
  const b64 = parts.join('');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const html = new TextDecoder('utf-8').decode(bytes);
  document.open();
  document.write(html);
  document.close();
}
load().catch(e => { document.body.innerHTML = '<p style="color:red;text-align:center">Ошибка загрузки: ' + e + '</p>'; });
</script>
</body>
</html>
